# Telar - Official Project Site
title: Telar
description: "A minimal-computing framework that weaves together IIIF images, audio, video, and texts to create layered visual narratives for digital scholarship, public exhibitions, community storytelling, and classroom projects."
baseurl: ""
url: "https://telar.org"
logo: "/images/telar.png"

# Theme
theme: just-the-docs
color_scheme: telar

# Aux links for header
aux_links:
  "Home":
    - "/"
  "GitHub":
    - "https://github.com/UCSB-AMPLab/telar"
  "Demo":
    - "https://ampl.clair.ucsb.edu/telar"

# Footer content
footer_content: "Developed by Adelaida Ávila, Ana María Cárdenas Gasca, Juan Cobo Betancourt, Natalie Cobo, Santiago Muñoz, and students and scholars at the UCSB Archives, Memory, and Preservation Lab, the UT Archives, Mapping, and Pedagogy Lab, and Neogranadina"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: order
nav_external_links:
  - title: Telar GitHub Repository
    url: https://github.com/UCSB-AMPLab/telar
    hide_icon: false

# Code copying
enable_copy_code_button: true

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Heading anchors
heading_anchors: true

# Callouts
callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  beta:
    title: Beta Release
    color: yellow

# Telar framework version (used across the docs site)
telar_version: "1.7.0"
telar_release_date: "2026-09-09"

# Showcase: form and gallery backed by the telar-showcase Worker
showcase_api: "https://showcase.telar.org"
showcase_turnstile_site_key: "0x4AAAAAAE2tYZjlIcT_XQw9"

# Build settings
markdown: kramdown
kramdown:
  math_engine: null
permalink: pretty

# Plugins
plugins:
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
