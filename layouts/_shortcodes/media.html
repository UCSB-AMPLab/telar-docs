{{ $m := index (index hugo.Data.docs_media.items (.Get "id")) .Page.Language.Lang }}{{ $l := index hugo.Data.docs_media.labels .Page.Language.Lang }}{{ $uid := printf "%s-%s" (.Get "id") (.Page.RelPermalink | replaceRE "[^\\pL\\pN]+" "-" | replaceRE "^-|-$" "") }}{{ with $m }}<figure class="docs-media{{ if .overview }} docs-media--overview{{ end }}" style="max-width:{{ .width }}px"><a class="docs-media-image" href="{{ .image }}" target="_blank" rel="noopener" aria-label="{{ $l.open }}"><img id="media-{{ $uid }}" src="{{ .image }}" alt="{{ .alt }}" width="{{ .width }}" height="{{ .height }}" loading="lazy" decoding="async"></a><figcaption><p>{{ .caption }}</p><div class="docs-media-actions" data-pagefind-ignore>{{ if .animation }}<button type="button" class="docs-media-play" aria-controls="media-{{ $uid }}" aria-pressed="false" data-play-demo data-animation="{{ .animation }}" data-poster="{{ .image }}" data-play-label="{{ $l.play }}" data-stop-label="{{ $l.stop }}">{{ $l.play }}</button>{{ end }}<a href="{{ .image }}" target="_blank" rel="noopener">{{ $l.open }} ↗</a>{{ if .animation }}<a href="{{ .animation }}" download>{{ $l.gif }}</a>{{ end }}</div></figcaption></figure>{{ end }}
