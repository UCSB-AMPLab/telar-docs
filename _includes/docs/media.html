{% assign media = site.data.docs_media.items[include.id][page.lang] %}{% assign media_labels = site.data.docs_media.labels[page.lang] %}{% assign media_uid = include.id | append: '-' | append: page.url | slugify %}
{% if media %}<figure class="docs-media{% if media.overview %} docs-media--overview{% endif %}" style="max-width:{{ media.width }}px">
<a class="docs-media-image" href="{{ media.image | relative_url }}" target="_blank" rel="noopener" aria-label="{{ media_labels.open | escape }}"><img id="media-{{ media_uid }}" src="{{ media.image | relative_url }}" alt="{{ media.alt | escape }}" width="{{ media.width }}" height="{{ media.height }}" loading="lazy" decoding="async"></a>
<figcaption><p>{{ media.caption }}</p><div class="docs-media-actions" data-pagefind-ignore>{% if media.animation %}<button type="button" class="docs-media-play" aria-controls="media-{{ media_uid }}" aria-pressed="false" data-play-demo data-animation="{{ media.animation | relative_url }}" data-poster="{{ media.image | relative_url }}" data-play-label="{{ media_labels.play }}" data-stop-label="{{ media_labels.stop }}">{{ media_labels.play }}</button>{% endif %}<a href="{{ media.image | relative_url }}" target="_blank" rel="noopener">{{ media_labels.open }} ↗</a>{% if media.animation %}<a href="{{ media.animation | relative_url }}" download>{{ media_labels.gif }}</a>{% endif %}</div></figcaption></figure>{% endif %}
